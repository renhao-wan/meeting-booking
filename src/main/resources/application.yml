server:
  port: 8090

spring:
  application:
    name: meeting-booking
  datasource:
    url: jdbc:mysql://localhost:3307/meeting_booking?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      encoding: UTF-8

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

booking:
  jwt:
    secret: ${JWT_SECRET:dev-secret-please-change}
    expire-hours: 2
  # 服务级凭证（X-Service-Key）：供上游 MCP 网关以系统账号转发调用；
  # 生产环境必须通过环境变量 BOOKING_SERVICE_KEY 注入强随机值
  service-key: ${BOOKING_SERVICE_KEY:booking-service-key}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
